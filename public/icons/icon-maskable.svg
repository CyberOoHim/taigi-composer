<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18181b" />
      <stop offset="50%" stop-color="#09090b" />
      <stop offset="100%" stop-color="#18181b" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="50%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="12" flood-color="#000000" flood-opacity="0.5" />
    </filter>
  </defs>

  <!-- Maskable full bleed background -->
  <rect width="512" height="512" fill="url(#bgGrad)" />

  <!-- Center musical medallion within safe zone (within 410x410 central area) -->
  <circle cx="256" cy="240" r="135" fill="#27272a" stroke="url(#goldGrad)" stroke-width="6" filter="url(#shadow)" />
  
  <!-- Jianpu (Numbered musical notation) Graphic: "1 5 6" notes -->
  <g id="notes" filter="url(#glow)">
    <!-- Note 1 -->
    <text x="175" y="245" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="82" fill="url(#goldGrad)" text-anchor="middle">1</text>
    <circle cx="175" cy="162" r="6" fill="#fbbf24" />
    
    <!-- Note 5 -->
    <text x="256" y="260" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="96" fill="#ffffff" text-anchor="middle">5</text>
    <circle cx="256" cy="152" r="7" fill="#f59e0b" />
    
    <!-- Note 6 -->
    <text x="337" y="245" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="82" fill="url(#goldGrad)" text-anchor="middle">6</text>
    <circle cx="337" cy="268" r="6" fill="#fbbf24" />
    
    <!-- Rhythm Underline Beam -->
    <rect x="150" y="280" width="212" height="6" rx="3" fill="url(#goldGrad)" />
    <rect x="235" y="292" width="127" height="5" rx="2.5" fill="#fbbf24" />
  </g>

  <!-- Label in safe area -->
  <text x="256" y="420" font-family="'Noto Sans TC', 'PingFang TC', system-ui, sans-serif" font-weight="800" font-size="30" fill="#f4f4f5" text-anchor="middle" letter-spacing="3">台語簡譜</text>
</svg>
