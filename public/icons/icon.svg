<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18181b" />
      <stop offset="50%" stop-color="#09090b" />
      <stop offset="100%" stop-color="#18181b" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="50%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#000000" flood-opacity="0.5" />
    </filter>
  </defs>

  <!-- Background rounded squircle -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />
  <rect width="504" height="504" x="4" y="4" rx="108" fill="none" stroke="url(#goldGrad)" stroke-width="6" stroke-opacity="0.4" />

  <!-- Outer ambient glow ring -->
  <circle cx="256" cy="246" r="168" fill="none" stroke="url(#goldGrad)" stroke-width="2" stroke-opacity="0.2" />
  
  <!-- Ambient musical wave / staff curves -->
  <path d="M 64 390 Q 160 350, 256 390 T 448 390" fill="none" stroke="url(#goldGrad)" stroke-width="3" stroke-opacity="0.3" stroke-dasharray="6 6" />
  <path d="M 64 414 Q 160 374, 256 414 T 448 414" fill="none" stroke="#71717a" stroke-width="1.5" stroke-opacity="0.3" />

  <!-- Center musical icon & Jianpu (1 2 3) and Taigi typography -->
  <!-- Glowing Center Medallion -->
  <circle cx="256" cy="220" r="130" fill="#27272a" stroke="url(#goldGrad)" stroke-width="5" filter="url(#shadow)" />
  
  <!-- Jianpu (Numbered musical notation) Graphic: "1 2 3" notes with under-beams & dots -->
  <g id="notes" filter="url(#glow)">
    <!-- Note 1 -->
    <text x="175" y="225" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="82" fill="url(#goldGrad)" text-anchor="middle">1</text>
    <!-- High tone dot above 1 -->
    <circle cx="175" cy="142" r="6" fill="#fbbf24" />
    
    <!-- Note 5 -->
    <text x="256" y="240" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="96" fill="#ffffff" text-anchor="middle">5</text>
    <!-- Sharp/Accent tone mark -->
    <circle cx="256" cy="132" r="7" fill="#f59e0b" />
    
    <!-- Note 6 -->
    <text x="337" y="225" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="82" fill="url(#goldGrad)" text-anchor="middle">6</text>
    <!-- Low tone dot below 6 -->
    <circle cx="337" cy="248" r="6" fill="#fbbf24" />
    
    <!-- Rhythm Underline Beam -->
    <rect x="150" y="260" width="212" height="6" rx="3" fill="url(#goldGrad)" />
    <rect x="235" y="272" width="127" height="5" rx="2.5" fill="#fbbf24" />
  </g>

  <!-- Microphone / Audio karaoke badge -->
  <g transform="translate(370, 90)" filter="url(#shadow)">
    <circle cx="24" cy="24" r="28" fill="#18181b" stroke="#10b981" stroke-width="3" />
    <!-- Mini Mic Icon -->
    <path d="M 24 12 C 20.7 12 18 14.7 18 18 L 18 26 C 18 29.3 20.7 32 24 32 C 27.3 32 30 29.3 30 26 L 30 18 C 30 14.7 27.3 12 24 12 Z" fill="#10b981" />
    <path d="M 14 24 C 14 29.5 18.5 34 24 34 C 29.5 34 34 29.5 34 24" fill="none" stroke="#10b981" stroke-width="2.5" stroke-linecap="round" />
    <line x1="24" y1="34" x2="24" y2="39" stroke="#10b981" stroke-width="2.5" stroke-linecap="round" />
  </g>

  <!-- Bottom Label: 台語簡譜 (TAIGI COMPOSER) -->
  <text x="256" y="458" font-family="'Noto Sans TC', 'PingFang TC', system-ui, sans-serif" font-weight="800" font-size="34" fill="#f4f4f5" text-anchor="middle" letter-spacing="4">台語簡譜</text>
  <text x="256" y="484" font-family="system-ui, sans-serif" font-weight="700" font-size="16" fill="#a1a1aa" text-anchor="middle" letter-spacing="3">TAIGI COMPOSER</text>
</svg>
